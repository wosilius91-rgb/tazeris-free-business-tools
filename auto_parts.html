<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAZERIS Auto Parts</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:auto;max-width:650px;padding:20px}section{background:#202e3b;padding:18px;border-radius:16px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:9px;max-width:100%;box-sizing:border-box}button{background:#45d3ad;color:#10221c;border:0;font-weight:bold;margin:8px 0}input{width:100%}img{max-width:100%;max-height:250px}a{color:#6de4cc}strong{font-size:25px}small{color:#b9c6d3}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{flex:1;font-size:14px}.item{background:#14202c;border-radius:12px;padding:12px;margin:12px 0}.pic{position:relative}.pic img{width:100%;height:180px;object-fit:contain}.stamp{position:absolute;top:12px;left:12px;background:#b91c1c;color:white;padding:8px;border-radius:5px;font-weight:bold}.item h3{margin:8px 0}[hidden]{display:none!important}</style><h1>TAZERIS Auto Parts</h1><nav><button data-page="estimate">Vertinimas</button> <button data-page="inventory">Sandėlis</button> <button data-page="sold">Parduota</button> <button data-page="reports">Ataskaitos</button></nav><section id="estimate"><input id="photo" type="file" accept="image/*"><img id="preview"><p id="status" role="status"></p><input id="part" placeholder="Atpažinta detalė (galima patikslinti)"><button id="search">Ieškoti kainų</button></section><section id="result" hidden><p>Rinkos kaina</p><strong id="market"></strong><p>Greito pardavimo kaina</p><strong id="quick"></strong><p id="sources"></p><button id="save">Į sandėlį</button></section><section id="inventory" hidden><h2>Sandėlis</h2><div id="stock"></div></section><section id="sold" hidden><h2>Parduota per mėnesį</h2><div id="soldList"></div></section><section id="reports" hidden><h2>Ataskaitos</h2><div id="periods"><button data-days="7">Savaitė</button> <button data-months="1">Mėnuo</button> <button data-months="3">3 mėn.</button> <button data-months="6">6 mėn.</button> <button data-months="12">Metai</button></div><p id="report">Pasirink laikotarpį</p><div id="reportList"></div></section><script type="module">
const $=id=>document.getElementById(id);let model, current, seq=0, photoUrl;let items=JSON.parse(localStorage.getItem('tazeris-parts-v1')||'[]');const money=n=>n.toFixed(2)+' €';let period=null;function cutoff(months,days){let d=new Date();if(days)d.setDate(d.getDate()-days);else{let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-months);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return d.getTime()}function soldTime(x){return x.soldAt||Date.parse(x.soldDate||'')||0}function tile(x,action){let p=document.createElement('article');p.className='item';let pic=document.createElement('div');pic.className='pic';if(x.photo){let img=document.createElement('img');img.src=x.photo;pic.append(img)}if(x.sold){let tag=document.createElement('span');tag.className='stamp';tag.textContent='PARDUOTA';pic.append(tag)}p.append(pic);let h=document.createElement('h3');h.textContent=x.name;p.append(h);let info=document.createElement('p');info.textContent=x.sold?'Parduota už '+money(x.sold)+' · '+(x.soldDate||''): 'Rinkos kaina: '+money(x.market)+' · Greito pardavimo: '+money(x.quick);p.append(info);if(action){let b=document.createElement('button');b.textContent=x.sold?'Grąžinti į sandėlį':'Parduota';b.onclick=()=>{if(x.sold){x.sold=0;delete x.soldDate;delete x.soldAt}else{let v=Number(prompt('Faktinė pardavimo kaina (€)',x.quick));if(!(v>0))return;x.sold=v;x.soldAt=Date.now();x.soldDate=new Date().toLocaleDateString('lt-LT')}persist()};p.append(b)}return p}function fill(id,list,action){$(id).replaceChildren(...list.map(x=>tile(x,action)));if(!list.length)$(id).textContent='Detalių nėra.'}function render(){fill('stock',items.filter(x=>!x.sold),true);fill('soldList',items.filter(x=>x.sold&&soldTime(x)>=cutoff(1)),true);if(period){let list=items.filter(x=>x.sold&&soldTime(x)>=cutoff(period.months,period.days));$('report').textContent='Parduota: '+list.length+' vnt. · Pardavimų suma: '+money(list.reduce((a,x)=>a+x.sold,0));fill('reportList',list,false)}}function persist(){try{localStorage.setItem('tazeris-parts-v1',JSON.stringify(items));render()}catch(e){alert('Nepavyko išsaugoti: telefono naršyklės saugykla pilna.')}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{for(let id of ['estimate','inventory','sold','reports'])$(id).hidden=id!==b.dataset.page;$('result').hidden=b.dataset.page!=='estimate'||!current;render()});document.querySelectorAll('#periods button').forEach(b=>b.onclick=()=>{period={months:Number(b.dataset.months||0),days:Number(b.dataset.days||0)};render()});render();async function thumbnail(){let img=$('preview');if(!img.naturalWidth)return '';let c=document.createElement('canvas');let k=Math.min(1,480/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.65)}
$('photo').onchange=async()=>{let id=++seq;current=null;$('result').hidden=true;$('part').value='';let f=$('photo').files[0];if(!f)return;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(f);$('preview').src=photoUrl;$('status').textContent='Kraunamas nemokamas modelis telefone. Pirmą kartą gali užtrukti.';try{let t=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');model??=t.pipeline('image-to-text','Xenova/vit-gpt2-image-captioning',{device:'wasm',dtype:'q8'});let p=await model;let r=await p(photoUrl);if(id!==seq)return;$('part').value=r[0].generated_text;$('status').textContent='Atpažinimas preliminarus. Patikrink detalės pavadinimą.'}catch(e){if(id===seq)$('status').textContent='Atpažinimas nepavyko. Galima patikslinti detalės pavadinimą.'}};
$('search').onclick=async()=>{let q=$('part').value.trim();if(!q){$('status').textContent='Pirmiausia atpažink detalę.';return}let id=++seq;current=null;$('result').hidden=true;$('search').disabled=true;$('status').textContent='Ieškoma kainų…';try{let r=await fetch('/prices?q='+encodeURIComponent(q));let d=await r.json();if(id!==seq)return;if(!r.ok||!d.prices.length)throw Error(d.error||'Patikimų kainų nerasta');let a=d.prices.map(x=>x.price).sort((a,b)=>a-b);let m=(a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2;current={name:q,market:m,quick:m*.85,sold:0};$('market').textContent=money(m);$('quick').textContent=money(m*.85);$('sources').replaceChildren(document.createTextNode('Orientacinis įvertis iš '+a.length+' paieškos rezultatų; greita kaina – 85 %.'));for(let x of d.prices){let p=document.createElement('p'),l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener';l.textContent=money(x.price)+' · '+x.title;p.append(l);$('sources').append(p)}$('result').hidden=false;$('status').textContent='Kainos pateiktos.'}catch(e){if(id===seq)$('status').textContent=e.message}finally{$('search').disabled=false}};
$('save').onclick=async()=>{if(current){items.push({...current,photo:await thumbnail(),addedAt:Date.now()});persist();current=null;$('save').textContent='Išsaugota';setTimeout(()=>$('save').textContent='Į sandėlį',1200)}};
</script></html>
