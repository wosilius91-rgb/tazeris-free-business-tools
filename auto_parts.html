<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAZERIS Auto Parts</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:auto;max-width:650px;padding:20px}section{background:#202e3b;padding:18px;border-radius:16px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:9px;max-width:100%;box-sizing:border-box}button{background:#45d3ad;color:#10221c;border:0;font-weight:bold;margin:8px 0}input{width:100%}img{max-width:100%;max-height:250px}a{color:#6de4cc}strong{font-size:25px}small{color:#b9c6d3}</style><h1>TAZERIS Auto Parts</h1><section><input id="photo" type="file" accept="image/*"><img id="preview"><p id="status" role="status"></p><input id="part" placeholder="Atpažinta detalė (galima patikslinti)"><button id="search">Ieškoti kainų</button></section><section id="result" hidden><p>Rinkos kaina</p><strong id="market"></strong><p>Greito pardavimo kaina</p><strong id="quick"></strong><p id="sources"></p><button id="save">Į sandėlį</button></section><section><h2>Sandėlyje</h2><div id="stock"></div><h2>Parduotos dalys – ataskaita</h2><div id="soldList"></div><p id="report"></p></section><script type="module">
const $=id=>document.getElementById(id);let model, current, seq=0, photoUrl;let items=JSON.parse(localStorage.getItem('tazeris-parts-v1')||'[]');const money=n=>n.toFixed(2)+' €';function render(){ $('stock').replaceChildren();$('soldList').replaceChildren();for(const x of items){let p=document.createElement('p');p.textContent=x.name+' · '+money(x.market)+' · '+(x.sold?'Parduota '+money(x.sold):'Sandėlyje');let b=document.createElement('button');b.textContent=x.sold?'Grąžinti':'Parduota';b.onclick=()=>{if(x.sold){x.sold=0;delete x.soldDate;}else{let v=Number(prompt('Pardavimo kaina',x.quick));if(!(v>0))return;x.sold=v;x.soldDate=new Date().toLocaleDateString('lt-LT')}persist()};if(x.soldDate)p.append(document.createTextNode(' · '+x.soldDate));p.append(b);$(x.sold?'soldList':'stock').append(p)}$('report').textContent='Sandėlio vertė: '+money(items.reduce((a,x)=>a+(x.sold?0:x.market),0))+' · Pardavimai: '+money(items.reduce((a,x)=>a+(x.sold||0),0))}function persist(){localStorage.setItem('tazeris-parts-v1',JSON.stringify(items));render()}render();
$('photo').onchange=async()=>{let id=++seq;current=null;$('result').hidden=true;$('part').value='';let f=$('photo').files[0];if(!f)return;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(f);$('preview').src=photoUrl;$('status').textContent='Kraunamas nemokamas modelis telefone. Pirmą kartą gali užtrukti.';try{let t=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');model??=t.pipeline('image-to-text','Xenova/vit-gpt2-image-captioning',{device:'wasm',dtype:'q8'});let p=await model;let r=await p(photoUrl);if(id!==seq)return;$('part').value=r[0].generated_text;$('status').textContent='Atpažinimas preliminarus. Patikrink detalės pavadinimą.'}catch(e){if(id===seq)$('status').textContent='Atpažinimas nepavyko. Galima patikslinti detalės pavadinimą.'}};
$('search').onclick=async()=>{let q=$('part').value.trim();if(!q){$('status').textContent='Pirmiausia atpažink detalę.';return}let id=++seq;current=null;$('result').hidden=true;$('search').disabled=true;$('status').textContent='Ieškoma kainų…';try{let r=await fetch('/prices?q='+encodeURIComponent(q));let d=await r.json();if(id!==seq)return;if(!r.ok||!d.prices.length)throw Error(d.error||'Patikimų kainų nerasta');let a=d.prices.map(x=>x.price).sort((a,b)=>a-b);let m=(a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2;current={name:q,market:m,quick:m*.85,sold:0};$('market').textContent=money(m);$('quick').textContent=money(m*.85);$('sources').replaceChildren(document.createTextNode('Orientacinis įvertis iš '+a.length+' paieškos rezultatų; greita kaina – 85 %.'));for(let x of d.prices){let p=document.createElement('p'),l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener';l.textContent=money(x.price)+' · '+x.title;p.append(l);$('sources').append(p)}$('result').hidden=false;$('status').textContent='Kainos pateiktos.'}catch(e){if(id===seq)$('status').textContent=e.message}finally{$('search').disabled=false}};
$('save').onclick=()=>{if(current){items.push({...current});persist();current=null;$('save').textContent='Išsaugota';setTimeout(()=>$('save').textContent='Į sandėlį',1200)}};
</script></html>
