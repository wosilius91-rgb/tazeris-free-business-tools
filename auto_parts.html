<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAZERIS Auto Parts</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:auto;max-width:650px;padding:20px}section{background:#202e3b;padding:18px;border-radius:16px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:9px;max-width:100%;box-sizing:border-box}button{background:#45d3ad;color:#10221c;border:0;font-weight:bold;margin:8px 0}input{width:100%}img{max-width:100%;max-height:250px}a{color:#6de4cc}strong{font-size:25px}small{color:#b9c6d3}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{flex:1;font-size:14px}.item{background:#14202c;border-radius:12px;padding:12px;margin:12px 0}.pic{position:relative}.pic img{width:100%;height:180px;object-fit:contain}.stamp{position:absolute;top:12px;left:12px;background:#b91c1c;color:white;padding:8px;border-radius:5px;font-weight:bold}.item h3{margin:8px 0}[hidden]{display:none!important}.busy::after{content:"";display:inline-block;width:1.5em;animation:dots 1.4s steps(4,end) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}button:disabled{opacity:.55}

</style><h1 class="workshop-banner"><img src="/auto-parts-workshop.webp" width="1672" height="941" alt="TAZERIS Auto Parts"></h1><section id="shared"><h2>Bendras katalogas</h2><p id="sharedStatus" role="status"></p><div id="sharedList"></div><details id="loginPanel"><summary>Administratoriaus prisijungimas</summary><form id="sharedLogin"><input id="sharedPassword" type="password" autocomplete="current-password" required placeholder="Slaptažodis"><button>Prisijungti</button></form></details><div id="sharedAdmin" hidden><button id="sharedLogout">Atsijungti</button><h3>Įkelti detalės nuotrauką</h3><input id="sharedPhoto" type="file" accept="image/jpeg,image/png,image/webp"><p id="sharedUploadStatus"></p><button id="sharedUpload">Įkelti nuotrauką</button><div id="sharedValuation" hidden><input id="sharedName" placeholder="Detalės pavadinimas / OEM kodas"><textarea id="sharedDescription" placeholder="Lietuviškas detalės aprašymas" rows="4" style="width:100%;box-sizing:border-box"></textarea><button id="sharedFind">Ieškoti kainų</button><div id="sharedEvidence"></div><button id="sharedCommit" disabled>Įrašyti į bendrą sandėlį</button></div><h3>Pardavimo ataskaitos</h3><div id="sharedPeriods"><button data-period="7d">7 d.</button> <button data-period="1m">1 mėn.</button> <button data-period="3m">3 mėn.</button> <button data-period="6m">6 mėn.</button> <button data-period="12m">12 mėn.</button></div><p id="sharedReport"></p></div></section><details id="localArchive" hidden><summary>Ankstesnis šio įrenginio sandėlis</summary><nav><button data-page="estimate">Vertinimas</button> <button data-page="inventory">Sandėlis</button> <button data-page="sold">Parduota</button> <button data-page="reports">Ataskaitos</button></nav><section id="estimate"><input id="photo" type="file" accept="image/*"><img id="preview"><p id="status" role="status"></p><input id="part" placeholder="Atpažinta detalė (galima patikslinti)"><button id="search">Ieškoti kainų</button></section><section id="result" hidden><p>Rinkos kaina</p><strong id="market"></strong><p>Greito pardavimo kaina</p><strong id="quick"></strong><p id="sources"></p><button id="save">Į sandėlį</button></section><section id="inventory" hidden><h2>Sandėlis</h2><button id="exportInventory">Atsisiųsti sandėlio atsarginę kopiją</button><label for="importInventory">Atkurti sandėlio kopiją (papildyti esamus duomenis)</label><input id="importInventory" type="file" accept=".json,application/json"><div id="stock"></div></section><section id="sold" hidden><h2>Parduota per mėnesį</h2><div id="soldList"></div></section><section id="reports" hidden><h2>Ataskaitos</h2><div id="periods"><button data-days="7">Savaitė</button> <button data-months="1">Mėnuo</button> <button data-months="3">3 mėn.</button> <button data-months="6">6 mėn.</button> <button data-months="12">Metai</button></div><p id="report">Pasirink laikotarpį</p><div id="reportList"></div></section></details><script type="module">
const $=id=>document.getElementById(id);let model, current, seq=0, photoUrl, recognition;const status=(message,busy=false)=>{$('status').textContent=message;$('status').classList.toggle('busy',busy)};let items=[];try{items=JSON.parse(localStorage.getItem('tazeris-parts-v1')||'[]');if(!Array.isArray(items))throw Error('Invalid inventory')}catch(e){items=[];alert('Nepavyko perskaityti sandėlio duomenų.')}$('exportInventory').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tazeris-sandelis-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importInventory').onchange=async()=>{let f=$('importInventory').files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('Kopija per didelė');let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.items))throw Error('Netinkamas kopijos formatas');let valid=x=>x&&typeof x.name==='string'&&x.name.trim()&&Number.isFinite(x.market)&&x.market>=0&&Number.isFinite(x.quick)&&x.quick>=0&&Number.isFinite(x.sold)&&x.sold>=0&&Number.isFinite(x.addedAt)&&(!x.sold||Number.isFinite(x.soldAt)&&x.soldAt>0)&&(!x.photo||typeof x.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x.photo));if(!data.items.every(valid))throw Error('Kopijoje yra netinkamų detalių; niekas nepakeista');let key=x=>JSON.stringify([x.addedAt,x.name,x.photo||'']);let seen=new Set(items.map(key));let additions=[];for(let x of data.items){let k=key(x);if(!seen.has(k)){seen.add(k);additions.push(x)}}if(!additions.length){alert('Naujų detalių nėra.');return}if(!confirm('Papildyti sandėlį '+additions.length+' detalėmis? Esamos detalės nebus pakeistos.'))return;let before=items;items=[...items,...additions];if(!persist()){items=before;render();return}alert('Atkurta: '+additions.length+' detalių.')}catch(e){alert(e.message)}finally{$('importInventory').value=''}};const money=n=>n.toFixed(2)+' €';let period=null;function cutoff(months,days){let d=new Date();if(days)d.setDate(d.getDate()-days);else{let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-months);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return d.getTime()}function soldTime(x){return x.soldAt||Date.parse(x.soldDate||'')||0}function tile(x,action){let p=document.createElement('article');p.className='item';let pic=document.createElement('div');pic.className='pic';if(x.photo){let img=document.createElement('img');img.src=x.photo;pic.append(img)}if(x.sold){let tag=document.createElement('span');tag.className='stamp';tag.textContent='PARDUOTA';pic.append(tag)}p.append(pic);let h=document.createElement('h3');h.textContent=x.name;p.append(h);let info=document.createElement('p');info.textContent=x.sold?'Parduota už '+money(x.sold)+' · '+(x.soldDate||''): 'Rinkos kaina: '+money(x.market)+' · Greito pardavimo: '+money(x.quick);p.append(info);if(action){let b=document.createElement('button');b.textContent=x.sold?'Grąžinti į sandėlį':'Parduota';b.onclick=()=>{let before={...x};if(x.sold){x.sold=0;delete x.soldDate;delete x.soldAt}else{let v=Number(prompt('Faktinė pardavimo kaina (€)',x.quick));if(!(v>0))return;x.sold=v;x.soldAt=Date.now();x.soldDate=new Date().toLocaleDateString('lt-LT')}if(!persist()){for(let k of Object.keys(x))delete x[k];Object.assign(x,before);render()}};p.append(b)}return p}function fill(id,list,action){$(id).replaceChildren(...list.map(x=>tile(x,action)));if(!list.length)$(id).textContent='Detalių nėra.'}function render(){fill('stock',items.filter(x=>!x.sold),true);fill('soldList',items.filter(x=>x.sold&&soldTime(x)>=cutoff(1)),true);if(period){let list=items.filter(x=>x.sold&&soldTime(x)>=cutoff(period.months,period.days));$('report').textContent='Parduota: '+list.length+' vnt. · Pardavimų suma: '+money(list.reduce((a,x)=>a+x.sold,0));fill('reportList',list,false)}}function persist(){try{localStorage.setItem('tazeris-parts-v1',JSON.stringify(items));render();return true}catch(e){alert('Nepavyko išsaugoti: telefono naršyklės saugykla pilna.');return false}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{for(let id of ['estimate','inventory','sold','reports'])$(id).hidden=id!==b.dataset.page;$('result').hidden=b.dataset.page!=='estimate'||!current;render()});document.querySelectorAll('#periods button').forEach(b=>b.onclick=()=>{period={months:Number(b.dataset.months||0),days:Number(b.dataset.days||0)};render()});render();async function thumbnail(){let img=$('preview');if(!img.naturalWidth)return '';let c=document.createElement('canvas');let k=Math.min(1,480/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.65)}
$('photo').onchange=()=>{recognition=(async()=>{let id=++seq;current=null;$('result').hidden=true;$('part').value='';let f=$('photo').files[0];if(!f)return;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(f);$('preview').src=photoUrl;status('Atpažįstama nuotrauka (pirmą kartą kraunamas modelis)',true);try{let t=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');model??=t.pipeline('image-to-text','Xenova/vit-gpt2-image-captioning',{device:'wasm',dtype:'q8'});let p=await model;let r=await p(photoUrl);if(id!==seq)return;$('part').value=r[0].generated_text;status('Detalė atpažinta. Galima ieškoti kainų.')}catch(e){if(id===seq)status('Atpažinimas nepavyko. Galima patikslinti detalės pavadinimą.')}})();};
$('search').onclick=async()=>{let originalSeq=seq;if(recognition&&!$('part').value.trim()){status('Laukiama nuotraukos atpažinimo',true);await recognition}if(originalSeq!==seq)return;let q=$('part').value.trim();if(!q){$('status').textContent='Pirmiausia atpažink detalę.';return}let id=++seq;current=null;$('result').hidden=true;$('search').disabled=true;status('Ieškoma kainų internete',true);let timer=setTimeout(()=>status('Tikrinami paieškos rezultatai',true),8000);try{let r=await fetch('/prices?q='+encodeURIComponent(q),{signal:AbortSignal.timeout(60000),cache:'no-store'});let d=await r.json();if(id!==seq)return;if(!r.ok||!d.prices.length)throw Error(d.error||'Patikimų kainų nerasta');let a=d.prices.map(x=>x.price).sort((a,b)=>a-b);let m=(a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2;current={name:q,market:m,quick:m*.85,sold:0};$('market').textContent=money(m);$('quick').textContent=money(m*.85);$('sources').replaceChildren(document.createTextNode('Orientacinis įvertis iš '+a.length+' paieškos rezultatų; greita kaina – 85 %.'));for(let x of d.prices){let p=document.createElement('p'),l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener';l.textContent=money(x.price)+' · '+x.title;p.append(l);$('sources').append(p)}$('result').hidden=false;status('Kainos pateiktos.')}catch(e){if(id===seq)status(e.name==='TimeoutError'?'Paieška užtruko per ilgai. Bandyk dar kartą.':e.message)}finally{clearTimeout(timer);$('search').disabled=false}};
$('save').onclick=async()=>{if(!current||$('save').disabled)return;let entry=current;$('save').disabled=true;try{let photo=await thumbnail();if(current!==entry)return;items.push({...entry,photo,addedAt:Date.now()});if(!persist()){items.pop();return}current=null;$('result').hidden=true;status('Detalė išsaugota sandėlyje.')}finally{$('save').disabled=false}};
</script><script type="module">
const el=id=>document.getElementById(id);let admin=false;
const msg=t=>el('sharedStatus').textContent=t;
async function api(path,data){const r=await fetch('/api/'+path,{credentials:'same-origin',cache:'no-store',...(data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})});const j=await r.json();if(!r.ok)throw Error(j.error||'Klaida');return j}
const euro=n=>Number(n).toFixed(2)+' €';
async function refresh(){try{admin=(await api('session')).admin;el('sharedAdmin').hidden=!admin;el('loginPanel').hidden=admin;el('localArchive').hidden=!admin;if(!admin)el('localArchive').open=false;const {items}=await api('items');el('sharedList').replaceChildren();for(const x of items){const card=document.createElement('article');card.className='item';const h=document.createElement('h3');h.textContent=x.name;card.append(h);if(/^\/api\/image\/[a-f0-9]{64}$/.test(x.photo)){const im=document.createElement('img');im.src=x.photo;im.loading='lazy';card.append(im)}const p=document.createElement('p');p.textContent=x.description||'';card.append(p);const price=document.createElement('p');price.textContent=x.status==='sold'?(admin&&Number.isFinite(x.actual_price_cents)?'PARDUOTA · Faktinė kaina: '+euro(x.actual_price_cents/100):'PARDUOTA'):'Rinkos: '+euro(x.market)+' · Greito pardavimo: '+euro(x.quick);card.append(price);if(admin&&x.status==='available'){const b=document.createElement('button');b.textContent='Parduota';b.onclick=async()=>{const v=prompt('Faktinė pardavimo kaina (€)',x.quick);if(v===null||!v.trim()||!Number.isFinite(Number(v))||Number(v)<0)return;b.disabled=true;try{await api('items/'+x.id+'/sell',{revision:x.revision,actual_price:Number(v)});await refresh()}catch(e){msg(e.message)}finally{b.disabled=false}};card.append(b);const edit=document.createElement('button');edit.textContent='Keisti greito pardavimo kainą';edit.onclick=async()=>{const v=prompt('Nauja greito pardavimo kaina (€)',x.quick);if(v===null)return;const amount=Number(v.trim().replace(',','.'));if(!Number.isFinite(amount)||amount<=0){msg('Įveskite teigiamą kainą.');return}edit.disabled=true;try{await api('items/'+x.id+'/price',{revision:x.revision,quick:amount});await refresh()}catch(e){msg(e.message)}finally{edit.disabled=false}};card.append(edit)}if(admin){const listings=document.createElement('button');listings.textContent='Išorinių skelbimų būsena';listings.onclick=async()=>{listings.disabled=true;try{const result=await api('items/'+x.id+'/publications');const view=document.createElement('div');view.textContent='Jungtys: '+Object.entries(result.connectors).map(([k,v])=>k+': '+v).join(' · ');for(const j of result.jobs){const p=document.createElement('p');p.textContent=j.platform+' · '+j.action+' · '+j.status+(j.last_error?' · '+j.last_error:'');view.append(p)}for(const l of result.listings){const p=document.createElement('p');p.textContent=l.platform+' · '+l.status+(l.external_url?' · '+l.external_url:'');view.append(p)}if(!result.jobs.length&&!result.listings.length){const p=document.createElement('p');p.textContent='Išorinių skelbimų nėra.';view.append(p)}card.append(view)}catch(e){msg(e.message)}finally{listings.disabled=false}};card.append(listings)}el('sharedList').append(card)}if(!items.length)el('sharedList').textContent='Detalių nėra.';msg('')}catch(e){msg('Bendras sandėlis nepasiekiamas: '+e.message)}}
el('sharedLogin').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:el('sharedPassword').value});await refresh()}catch(e){msg(e.message)}finally{el('sharedPassword').value=''}};
el('sharedLogout').onclick=async()=>{try{await api('logout',{});await refresh()}catch(e){msg(e.message)}};
el('sharedUpload').onclick=async()=>{const f=el('sharedPhoto').files[0];if(!f)return;const b=el('sharedUpload');b.disabled=true;el('sharedUploadStatus').dataset.photo='';el('sharedValuation').hidden=true;el('sharedEvidence').replaceChildren();sharedQuote=null;el('sharedCommit').disabled=true;try{if(f.size>8*1024*1024)throw Error('Nuotrauka viršija 8 MB');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});const result=await api('upload',{data,mime:f.type});el('sharedUploadStatus').textContent='Nuotrauka išsaugota. Įveskite tikslų detalės pavadinimą arba OEM kodą kainų paieškai.';el('sharedUploadStatus').dataset.photo=result.photo;el('sharedValuation').hidden=false;el('sharedEvidence').replaceChildren();sharedQuote=null;el('sharedCommit').disabled=true}catch(e){el('sharedUploadStatus').textContent=e.message}finally{b.disabled=false}};
let sharedQuote=null;
el('sharedName').oninput=()=>{sharedQuote=null;el('sharedCommit').disabled=true;el('sharedEvidence').replaceChildren()};
el('sharedFind').onclick=async()=>{const name=el('sharedName').value.trim();if(!name)return;const b=el('sharedFind');b.disabled=true;sharedQuote=null;el('sharedCommit').disabled=true;el('sharedEvidence').textContent='Ieškoma kainų…';try{const r=await fetch('/prices?q='+encodeURIComponent(name),{signal:AbortSignal.timeout(60000),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Paieška nepavyko');if(name!==el('sharedName').value.trim())return;const sources=[...new Map(d.prices.filter(x=>x.url.startsWith('https://')&&Number.isFinite(x.price)&&x.price>0).map(x=>[x.url,x])).values()];if(sources.length<2)throw Error('Nepakanka kainų šaltinių');const a=sources.map(x=>x.price).sort((a,b)=>a-b);const market=Math.round((a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2*100)/100;const quick=Math.round(market*85)/100;sharedQuote={name,market,quick,sources};el('sharedEvidence').textContent='Orientacinė rinkos kaina: '+euro(market)+' · Greito pardavimo: '+euro(quick)+'. Patikrinkite, ar skelbimai atitinka detalę.';for(const x of sources){const p=document.createElement('p'),a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=euro(x.price)+' · '+x.title;p.append(a);el('sharedEvidence').append(p)}el('sharedCommit').disabled=false}catch(e){el('sharedEvidence').textContent=e.message}finally{b.disabled=false}};
el('sharedCommit').onclick=async()=>{const q=sharedQuote,description=el('sharedDescription').value.trim(),photo=el('sharedUploadStatus').dataset.photo;if(!q||!description||!photo)return;const b=el('sharedCommit');b.disabled=true;try{await api('items',{...q,description,photo});sharedQuote=null;el('sharedValuation').hidden=true;el('sharedPhoto').value='';el('sharedName').value='';el('sharedDescription').value='';el('sharedUploadStatus').textContent='Detalė įrašyta į bendrą sandėlį.';await refresh()}catch(e){el('sharedUploadStatus').textContent=e.message;b.disabled=false}};
document.querySelectorAll('#sharedPeriods button').forEach(b=>b.onclick=async()=>{try{const r=await api('report?period='+b.dataset.period);el('sharedReport').textContent='Parduota: '+r.count+' vnt. · '+euro(r.revenue_cents/100)}catch(e){el('sharedReport').textContent=e.message}});refresh();
</script></html>
